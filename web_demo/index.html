<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Thaheen mini offline LMS, running as a Flutter web demo inside an iPhone frame.">
  <title>Thaheen demo</title>
  <script>
    // The frame is for desktop viewers. Phones, in either orientation, get the app on its own.
    const isPhone = matchMedia('(pointer: coarse) and (max-width: 600px), (pointer: coarse) and (max-height: 600px)');
    if (isPhone.matches) location.replace('app/' + location.hash);
  </script>
  <style>
    :root {
      --screen-w: 393px;
      --screen-h: 852px;
      --bezel: 14px;
      --radius: 60px;
      --status-h: 50px;
      --page-bg: #e7e7ea;
      --page-fg: #18181b;
      --page-muted: #71717a;
      --screen-bg: #ffffff;
      --screen-fg: #0a0a0a;
      --scale: 1;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page-bg: #111113;
        --page-fg: #e4e4e7;
        --page-muted: #a1a1aa;
      }
    }

    body[data-app-theme="dark"] {
      --screen-bg: #0a0a0a;
      --screen-fg: #fafafa;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--page-bg);
      color: var(--page-fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }

    .intro {
      position: fixed;
      top: 24px;
      left: 28px;
      max-width: 280px;
    }

    .intro h1 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .intro p {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      color: var(--page-muted);
    }

    .device {
      position: absolute;
      top: 50%;
      left: 50%;
      width: calc(var(--screen-w) + 2 * var(--bezel));
      height: calc(var(--screen-h) + 2 * var(--bezel));
      margin-top: calc((var(--screen-h) + 2 * var(--bezel)) / -2);
      margin-left: calc((var(--screen-w) + 2 * var(--bezel)) / -2);
      border-radius: var(--radius);
      background: #1c1c1e;
      box-shadow: 0 0 0 2px #3f3f46, 0 30px 80px rgba(0, 0, 0, 0.35);
      transform: rotate(0deg) scale(var(--scale));
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .screen {
      position: absolute;
      inset: var(--bezel);
      overflow: hidden;
      border-radius: calc(var(--radius) - var(--bezel));
      background: var(--screen-bg);
      transition: background 0.3s;
    }

    .status {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: var(--status-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 34px 0 40px;
      color: var(--screen-fg);
      font-size: 15px;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .status svg {
      display: block;
      fill: currentColor;
    }

    .island {
      position: absolute;
      z-index: 2;
      top: 11px;
      left: 50%;
      width: 124px;
      height: 36px;
      margin-left: -62px;
      border-radius: 20px;
      background: #000;
    }

    .home {
      position: absolute;
      z-index: 2;
      bottom: 8px;
      left: 50%;
      width: 134px;
      height: 5px;
      margin-left: -67px;
      border-radius: 3px;
      background: var(--screen-fg);
      opacity: 0.35;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .app {
      position: absolute;
      top: var(--status-h);
      left: 0;
      width: var(--screen-w);
      height: calc(var(--screen-h) - var(--status-h));
      border: 0;
      background: var(--screen-bg);
    }

    /* Landscape: the whole phone turns 90° to the left, and the app is laid out
       sideways inside it and turned back, so it ends up upright and wide. */
    .device.landscape {
      transform: rotate(-90deg) scale(var(--scale));
    }

    .device.landscape .screen {
      background: #000;
    }

    .device.landscape .status,
    .device.landscape .home {
      opacity: 0;
    }

    .device.landscape .app {
      top: calc((var(--screen-h) - var(--screen-w)) / 2);
      left: calc((var(--screen-w) - var(--screen-h)) / 2);
      width: var(--screen-h);
      height: var(--screen-w);
      transform: rotate(90deg);
    }

    @media (max-width: 900px) {
      .intro {
        display: none;
      }
    }

    /* A desktop window squeezed to phone width drops the frame too. */
    @media (max-width: 600px) {
      .status, .island, .home {
        display: none;
      }

      .device, .device.landscape {
        inset: 0;
        width: auto;
        height: auto;
        margin: 0;
        border-radius: 0;
        box-shadow: none;
        transform: none;
      }

      .screen {
        inset: 0;
        border-radius: 0;
      }

      .app, .device.landscape .app {
        inset: 0;
        width: 100%;
        height: 100%;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="intro">
    <h1>Thaheen mini LMS</h1>
    <p>Flutter web build of the app, framed as an iPhone. Open a lesson and hit fullscreen to see the phone rotate.</p>
  </div>

  <div class="device" id="device">
    <div class="screen">
      <div class="status">
        <span id="clock">9:41</span>
        <svg width="70" height="13" viewBox="0 0 70 13" aria-hidden="true">
          <rect x="0" y="8" width="3" height="5" rx="1"/>
          <rect x="5" y="6" width="3" height="7" rx="1"/>
          <rect x="10" y="3" width="3" height="10" rx="1"/>
          <rect x="15" y="0" width="3" height="13" rx="1"/>
          <path d="M31 11.5 29 9.4a3 3 0 0 1 4 0zM26.4 6.8a6.6 6.6 0 0 1 9.2 0l-1.5 1.5a4.5 4.5 0 0 0-6.2 0zM23.8 4.2a10.3 10.3 0 0 1 14.4 0l-1.5 1.5a8.2 8.2 0 0 0-11.4 0z"/>
          <rect x="44" y="1" width="22" height="11" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
          <rect x="46" y="3" width="16" height="7" rx="1.5"/>
          <rect x="67" y="4.5" width="2" height="4" rx="1" fill-opacity="0.4"/>
        </svg>
      </div>
      <div class="island"></div>
      <iframe class="app" src="app/" title="Thaheen app" allow="autoplay; fullscreen"></iframe>
      <div class="home"></div>
    </div>
  </div>

  <script>
    const device = document.getElementById('device');
    const clock = document.getElementById('clock');
    const margin = 48;

    function fit() {
      const style = getComputedStyle(document.documentElement);
      const bezel = parseFloat(style.getPropertyValue('--bezel')) * 2;
      const w = parseFloat(style.getPropertyValue('--screen-w')) + bezel;
      const h = parseFloat(style.getPropertyValue('--screen-h')) + bezel;
      const [boxW, boxH] = device.classList.contains('landscape') ? [h, w] : [w, h];
      const scale = Math.min(1, (innerWidth - margin) / boxW, (innerHeight - margin) / boxH);
      document.documentElement.style.setProperty('--scale', scale.toFixed(3));
    }

    function tick() {
      const now = new Date();
      clock.textContent = `${now.getHours() % 12 || 12}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    addEventListener('message', (event) => {
      if (event.origin !== location.origin) return;
      const { type, value } = event.data ?? {};
      if (type === 'thaheen:fullscreen') {
        device.classList.toggle('landscape', value === true);
        fit();
      } else if (type === 'thaheen:brightness') {
        document.body.dataset.appTheme = value;
      }
    });

    addEventListener('resize', fit);
    fit();
    tick();
    setInterval(tick, 10000);
  </script>
</body>
</html>
