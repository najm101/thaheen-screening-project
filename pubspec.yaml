name: thaheen_lms
description: "Thaheen mini offline LMS (Flutter screening task)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  bloc: ^9.2.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  forui: ^0.27.1
  go_router: ^18.0.1
  intl: ^0.20.3
  video_player: ^2.14.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  generate: true

  assets:
    - assets/data/
    - assets/images/
    - assets/videos/

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
